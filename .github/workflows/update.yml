name: Auto Update Docs

on:
  schedule:
    - cron: '0 0 * * *' # هر روز ساعت ۱۲ شب به طور خودکار اجرا می‌شود
  workflow_dispatch: # اجازه می‌دهد دکمه‌ای در گیت‌هاب باشد که هر وقت خواستید دستی اجراش کنید

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        run: python update_docs.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update docs [skip ci]" && git push)
